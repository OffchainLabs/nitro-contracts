name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  audit_before_merge_check:
    name: Audit before merge check
    runs-on: ubuntu-latest
    steps:
      - name: Block merging PRs labelled audit-before-merge
        if: contains(github.event.pull_request.labels.*.name, 'audit-before-merge')
        run: |
          echo -e '\x1b[31mThis PR is labelled audit-before-merge. Remove the label once this PR is audited. See docs/audit-before-merge.md.\x1b[0m'
          exit 1
