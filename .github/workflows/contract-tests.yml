name: CI

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - develop

jobs:
  test-unit:
    name: Test unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/install-foundry

      - name: Setup node/yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install packages
        run: yarn

      - name: Build
        run: yarn test:foundry
  tests:
    name: Contract tests
    runs-on: ubuntu-8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/install-foundry

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install Foundry
        uses: ./.github/actions/install-foundry

      - name: Install dependencies
        run: yarn install

      - name: Check Format
        run: yarn format:check

      - name: Lint Contracts
        run: yarn solhint

      - name: Lint Test Scripts
        run: yarn lint:test

      - name: Compare bytecodes
        run: yarn test:bytecodes

      - name: Build
        run: yarn build:all

      - name: Run tests
        run: yarn hardhat --network hardhat test test/contract/*.spec.ts

      - name: Run prover tests
        run: yarn test:prover

      - name: Interface compatibility
        run: yarn run test:compatibility

      - name: Forge build
        run: forge build

      - name: Test size
        run: yarn contract:size

      - name: Test Storage Layouts
        run: yarn run test:storage

      - name: Test function signatures
        run: yarn run test:signatures

      - name: Run unused Solidity errors checker
        uses: OffchainLabs/actions/check-unused-errors@main
        with:
          directory: './src'
          exceptions_file: './test/unused-errors/exceptions.txt'

      - name: Upload 4bytes
        continue-on-error: true
        run: yarn upload-4bytes

  test-4844:
    name: 4844 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/install-foundry

      - uses: OffchainLabs/actions/run-nitro-test-node@main
        with:
          args: --pos
          no-token-bridge: true

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build:all

      - name: Test 4844
        run: yarn test:4844

  test-e2e:
    name: Test e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: OffchainLabs/actions/run-nitro-test-node@main
        with:
          l3-node: true
          no-token-bridge: true
          no-l3-token-bridge: true
          nitro-contracts-branch: '${{ github.event.pull_request.head.sha || github.sha }}'
          nitro-testnode-ref: release

      - name: Setup node/yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install packages
        run: yarn

      - name: Compile contracts
        run: yarn build

      - name: Run e2e tests
        run: yarn test:e2e

  test-e2e-custom-fee-token:
    name: Test e2e custom fee token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: OffchainLabs/actions/run-nitro-test-node@main
        with:
          l3-node: true
          args: --l3-fee-token
          no-token-bridge: true
          no-l3-token-bridge: true
          nitro-contracts-branch: '${{ github.event.pull_request.head.sha || github.sha }}'
          nitro-testnode-ref: release

      - name: Setup node/yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install packages
        run: yarn

      - name: Compile contracts
        run: yarn build

      - name: Run e2e tests
        run: yarn test:e2e

  test-e2e-fee-token-6-decimals:
    name: Test e2e fee token with 6 decimals and pricer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: OffchainLabs/actions/run-nitro-test-node@main
        with:
          l3-node: true
          args: --l3-fee-token --l3-fee-token-pricer --l3-fee-token-decimals 6
          no-token-bridge: true
          no-l3-token-bridge: true
          nitro-testnode-ref: release
          nitro-contracts-branch: '${{ github.event.pull_request.head.sha || github.sha }}'

      - name: Setup node/yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install packages
        run: yarn

      - name: Compile contracts
        run: yarn build

      - name: Run e2e tests
        run: yarn test:e2e

  coverage:
    name: Coverage (Foundry)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: ./.github/actions/install-foundry

      - name: Setup node/yarn
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install packages
        run: yarn

      - name: Run coverage
        run: yarn coverage:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true
          disable_search: true
          flags: foundry
          cleanup: true
