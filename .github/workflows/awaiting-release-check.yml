name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  awaiting_release_check:
    name: Awaiting release check
    runs-on: ubuntu-latest
    steps:
      - name: Block merging PRs labelled awaiting-release
        if: contains(github.event.pull_request.labels.*.name, 'awaiting-release')
        run: |
          echo -e '\x1b[31mThis PR is labelled awaiting-release. Remove the label when it is being included in a release. See docs/awaiting-release.md.\x1b[0m'
          exit 1
