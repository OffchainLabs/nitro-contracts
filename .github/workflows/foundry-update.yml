name: Foundry Update

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  foundry-update:
    uses: OffchainLabs/actions/.github/workflows/foundry-update.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      reviewer: yahgwai
      fix-up: |
        forge fmt
        yarn test:storage || true
        yarn test:signatures || true
