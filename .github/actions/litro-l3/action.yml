name: Litro L3
description: Boot arbitrum-litro's L1+L2, deploy this checkout's contracts and an L3 rollup on the L2, and run the L3 node
inputs:
  fee-token-decimals:
    description: 'Fee token decimals (18 or 6); empty for an ETH-fee L3'
    required: false
    default: ''
  fee-token-pricer:
    description: 'Deploy a ConstantExchangeRatePricer for the fee token'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # litro's L2 reads L1 every 15s by default, and an L3 assertion is confirmable only once the L2 has seen
    # a newer L1 block, so each withdrawal waited up to 15s more. The v0.5.1 action can't set the image's
    # TESTNODE_PARENT_CHAIN_POLL_INTERVAL, so boot an image that sets it.
    - name: Build litro image that reads L1 every 250ms
      shell: bash
      run: |
        docker pull ghcr.io/offchainlabs/arbitrum-litro:v0.5.1-nc3.2-l2
        printf 'FROM ghcr.io/offchainlabs/arbitrum-litro:v0.5.1-nc3.2-l2\nENV TESTNODE_PARENT_CHAIN_POLL_INTERVAL=250ms\n' |
          docker build -q -t local/arbitrum-litro:v0.5.1-l2-fast -

    - id: litro
      uses: OffchainLabs/arbitrum-litro@v0.5.1
      with:
        version: v0.5.1
        l3-enabled: 'false'
        image-ref: local/arbitrum-litro:v0.5.1-l2-fast

    - name: Deploy L3 rollup
      shell: bash
      env:
        FEE_TOKEN_DECIMALS: ${{ inputs.fee-token-decimals }}
        FEE_TOKEN_PRICER: ${{ inputs.fee-token-pricer }}
      run: test/e2e/litro/l3.bash deploy "$RUNNER_TEMP/l3"

    - name: Start L3 node
      shell: bash
      env:
        L3_IMAGE: ${{ steps.litro.outputs.image-ref }}
      run: test/e2e/litro/l3.bash start "$RUNNER_TEMP/l3"

    - name: Fund L3 accounts
      shell: bash
      run: |
        test/e2e/litro/l3.bash fund "$RUNNER_TEMP/l3"
        echo "L3_DEPLOYMENT_PATH=$RUNNER_TEMP/l3/l3deployment.json" >> "$GITHUB_ENV"
